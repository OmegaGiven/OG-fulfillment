<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#0f172a"/>

  <!-- Box: left side, bottom, right side (no top edge) -->
  <polyline
    points="354,460 354,664 670,664 670,460"
    fill="none"
    stroke="#e2e8f0"
    stroke-width="35"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Left flap: 45° outward + upward from top of left side -->
  <line
    x1="354" y1="460"
    x2="254" y2="360"
    stroke="#e2e8f0"
    stroke-width="35"
    stroke-linecap="round"/>

  <!-- Right flap: 45° outward + upward from top of right side -->
  <line
    x1="670" y1="460"
    x2="770" y2="360"
    stroke="#e2e8f0"
    stroke-width="35"
    stroke-linecap="round"/>

  <!-- Checkmark: rises from inside the box and out through the top opening -->
  <polyline
    points="415,532 486,604 625,376"
    fill="none"
    stroke="#22c55e"
    stroke-width="41"
    stroke-linecap="round"
    stroke-linejoin="round"/>

</svg>
